<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-made: <symbol> / <use> with viewBox scaling, <use> of a group with its own transform,
     nested <svg> viewports, CSS in <style> and a style attribute. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="300" height="200" viewBox="0 0 300 200">
  <style>
    .gold { fill: #ffd700 }
    #dot circle { fill: green }
    circle.red { fill: red; stroke: none }
  </style>
  <defs>
    <symbol id="star" viewBox="0 0 10 10">
      <polygon class="gold" points="5,0 6,4 10,4 7,6 8,10 5,7 2,10 3,6 0,4 4,4"/>
    </symbol>
    <g id="dot"><circle class="red" cx="0" cy="0" r="5"/></g>
  </defs>
  <use xlink:href="#star" x="10" y="20" width="40" height="40"/>
  <use href="#star" x="100" y="20" width="20" height="40"/>
  <use xlink:href="#dot" transform="translate(200,100) scale(2)" x="5" y="5"/>
  <svg x="220" y="150" width="60" height="30" viewBox="0 0 10 10" preserveAspectRatio="none">
    <rect width="10" height="10" style="fill:blue"/>
  </svg>
</svg>
