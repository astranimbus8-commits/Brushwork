name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# v1.9 (LA3, design 2.2 and 5.5): the non-timing tests run in two shards in parallel
# (app/build.gradle.kts, -PtestShard), the @Category(Timing) tests in a third job alone in one
# JVM (-PtimingOnly), test-count checks that both shards together ran at least the floor of
# app/src/test/test-count.txt, and the release APK is built once all three are green.
jobs:
  unit:
    name: Unit tests (shard ${{ matrix.testShard }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        testShard: [ 0, 1 ]
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v6

      # The log goes with the XML: test-count reads its "> Task :app:testDebugUnitTest" line.
      - name: Unit tests
        run: |
          set -o pipefail
          ./gradlew --no-daemon --console=plain testDebugUnitTest -PtestShard=${{ matrix.testShard }} -PtestShards=2 2>&1 | tee "$RUNNER_TEMP/gradle.log"

      - name: Collect the test results
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/test-results"
          cp app/build/test-results/testDebugUnitTest/*.xml "$RUNNER_TEMP/test-results/" 2>/dev/null || true
          cp "$RUNNER_TEMP/gradle.log" "$RUNNER_TEMP/test-results/" 2>/dev/null || true

      # Always: test-count sums them, and on a red run they hold the messages.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ matrix.testShard }}
          path: ${{ runner.temp }}/test-results/
          if-no-files-found: ignore

  # The @Category(Timing) tests, alone in one JVM (app/build.gradle.kts, -PtimingOnly).
  timing:
    name: Timing tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v6

      - name: Timing tests
        run: ./gradlew --no-daemon testDebugUnitTest -PtimingOnly

      # Always: the messages of a red run, and what the timing tests printed (test-times-v19.ps1).
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-timing
          path: app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: ignore

  # The JUnit XML of both shards, cached or not, must count at least the floor of
  # app/src/test/test-count.txt (raised at each merge, lowered only with a deliberate deletion).
  test-count:
    name: Test count
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v6

      - uses: actions/download-artifact@v7
        with:
          pattern: test-results-[0-9]
          path: shards

      - name: Count the tests of both shards
        run: |
          python3 - <<'EOF'
          import glob, os, sys
          import xml.etree.ElementTree as ET

          floor = int(open('app/src/test/test-count.txt', encoding='utf-8').read().split()[0])
          errors = []
          total = 0
          for shard in ('0', '1'):
              folder = os.path.join('shards', 'test-results-' + shard)
              xmls = sorted(glob.glob(os.path.join(folder, 'TEST-*.xml')))
              if not xmls:
                  errors.append('shard %s uploaded no JUnit XML' % shard)
              log = os.path.join(folder, 'gradle.log')
              if not os.path.isfile(log):
                  errors.append('shard %s uploaded no Gradle log' % shard)
              else:
                  text = open(log, encoding='utf-8', errors='replace').read()
                  if '> Task :app:testDebugUnitTest NO-SOURCE' in text:
                      errors.append('shard %s: testDebugUnitTest found no tests (NO-SOURCE)' % shard)
                  if '> Task :app:testDebugUnitTest FROM-CACHE' in text:
                      print('::warning::shard %s: testDebugUnitTest came from the build cache (its XML still counts)' % shard)
              count = sum(int(ET.parse(f).getroot().get('tests', '0')) for f in xmls)
              print('shard %s: %d tests in %d classes' % (shard, count, len(xmls)))
              total += count
          print('both shards: %d tests; floor %d' % (total, floor))
          if total < floor:
              errors.append('%d tests, below the floor %d of app/src/test/test-count.txt' % (total, floor))
          for e in errors:
              print('::error::' + e)
          sys.exit(1 if errors else 0)
          EOF

  release:
    name: Build release APK
    needs: [ unit, timing, test-count ]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v6

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "BW_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Release key restored."
          else
            echo "No KEYSTORE_BASE64 secret: the APK will be signed with a debug key."
          fi

      - name: Build release APK
        env:
          BW_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BW_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          BW_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          BW_VERSION_CODE: ${{ github.run_number }}
          BW_VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/Brushwork-${GITHUB_REF_NAME//\//-}.apk"
          ls -la dist

      - uses: actions/upload-artifact@v7
        with:
          name: Brushwork-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.apk
          generate_release_notes: true
