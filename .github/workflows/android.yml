name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  # v1.9 A8 (R16): the release job reads the run number of the last release tag's build.
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# v1.9 (LA3, design 2.2 and 5.5): the non-timing tests run in three shards in parallel
# (app/build.gradle.kts, -PtestShard; three since Gate 2, when a two-shard test step passed the
# 26-minute fallback of design 5.5), the @Category(Timing) tests in their own job alone in one
# JVM (-PtimingOnly), test-count checks that the shards together ran at least the floor of
# app/src/test/test-count.txt, and the release APK is built once all of them are green.
# v1.10 F1 (design 3.3 and 6.5): unit-full runs the suite again in three shards at the FULL engine
# level (-PunitFull: -PengineMode=full with ChaosResidency, without the Timing, ClassicOnly and
# EngineGolden tests and the classes of app/src/test/unit-full-backlog.txt), and test-count checks
# its floor too (app/src/test/test-count-full.txt).
jobs:
  unit:
    name: Unit tests (shard ${{ matrix.testShard }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        testShard: [ 0, 1, 2 ]
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v6

      # The log goes with the XML: test-count reads its "> Task :app:testDebugUnitTest" line.
      - name: Unit tests
        run: |
          set -o pipefail
          ./gradlew --no-daemon --console=plain testDebugUnitTest -PtestShard=${{ matrix.testShard }} -PtestShards=3 2>&1 | tee "$RUNNER_TEMP/gradle.log"

      - name: Collect the test results
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/test-results"
          cp app/build/test-results/testDebugUnitTest/*.xml "$RUNNER_TEMP/test-results/" 2>/dev/null || true
          cp "$RUNNER_TEMP/gradle.log" "$RUNNER_TEMP/test-results/" 2>/dev/null || true

      # Always: test-count sums them, and on a red run they hold the messages.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ matrix.testShard }}
          path: ${{ runner.temp }}/test-results/
          if-no-files-found: ignore

  # v1.10 F1: the suite at FULL (app/build.gradle.kts, -PunitFull), three shards like unit.
  unit-full:
    name: Unit tests at FULL (shard ${{ matrix.testShard }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        testShard: [ 0, 1, 2 ]
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v6

      # The log goes with the XML: test-count reads its "> Task :app:testDebugUnitTest" line.
      - name: Unit tests at FULL
        run: |
          set -o pipefail
          ./gradlew --no-daemon --console=plain testDebugUnitTest -PengineMode=full -PunitFull -PtestShard=${{ matrix.testShard }} -PtestShards=3 2>&1 | tee "$RUNNER_TEMP/gradle.log"

      - name: Collect the test results
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/test-results"
          cp app/build/test-results/testDebugUnitTest/*.xml "$RUNNER_TEMP/test-results/" 2>/dev/null || true
          cp "$RUNNER_TEMP/gradle.log" "$RUNNER_TEMP/test-results/" 2>/dev/null || true

      # Always: test-count sums them, and on a red run they hold the messages.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-full-${{ matrix.testShard }}
          path: ${{ runner.temp }}/test-results/
          if-no-files-found: ignore

  # The @Category(Timing) tests, alone in one JVM (app/build.gradle.kts, -PtimingOnly).
  timing:
    name: Timing tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v6

      - name: Timing tests
        run: ./gradlew --no-daemon testDebugUnitTest -PtimingOnly

      # Always: the messages of a red run, and what the timing tests printed (test-times-v19.ps1).
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-timing
          path: app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: ignore

  # The JUnit XML of every shard, cached or not, must count at least the floor of
  # app/src/test/test-count.txt (raised at each merge, lowered only with a deliberate deletion);
  # v1.10 F1: the unit-full shards likewise against app/src/test/test-count-full.txt.
  test-count:
    name: Test count
    needs: [ unit, unit-full ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v6

      - uses: actions/download-artifact@v7
        with:
          pattern: test-results-[0-9]
          path: shards

      - uses: actions/download-artifact@v7
        with:
          pattern: test-results-full-[0-9]
          path: shards-full

      - name: Count the tests of every shard
        run: |
          python3 - <<'EOF'
          import glob, os, sys
          import xml.etree.ElementTree as ET

          errors = []

          def check(job, root, prefix, floor_file):
              floor = int(open(floor_file, encoding='utf-8').read().split()[0])
              total = 0
              for shard in ('0', '1', '2'):
                  name = '%s shard %s' % (job, shard)
                  folder = os.path.join(root, prefix + shard)
                  xmls = sorted(glob.glob(os.path.join(folder, 'TEST-*.xml')))
                  if not xmls:
                      errors.append('%s uploaded no JUnit XML' % name)
                  log = os.path.join(folder, 'gradle.log')
                  if not os.path.isfile(log):
                      errors.append('%s uploaded no Gradle log' % name)
                  else:
                      text = open(log, encoding='utf-8', errors='replace').read()
                      if '> Task :app:testDebugUnitTest NO-SOURCE' in text:
                          errors.append('%s: testDebugUnitTest found no tests (NO-SOURCE)' % name)
                      if '> Task :app:testDebugUnitTest FROM-CACHE' in text:
                          print('::warning::%s: testDebugUnitTest came from the build cache (its XML still counts)' % name)
                  count = sum(int(ET.parse(f).getroot().get('tests', '0')) for f in xmls)
                  print('%s: %d tests in %d classes' % (name, count, len(xmls)))
                  total += count
              print('%s, all shards: %d tests; floor %d' % (job, total, floor))
              if total < floor:
                  errors.append('%s: %d tests, below the floor %d of %s' % (job, total, floor, floor_file))

          check('unit', 'shards', 'test-results-', 'app/src/test/test-count.txt')
          check('unit-full', 'shards-full', 'test-results-full-', 'app/src/test/test-count-full.txt')
          for e in errors:
              print('::error::' + e)
          sys.exit(1 if errors else 0)
          EOF

  release:
    name: Build release APK
    needs: [ unit, unit-full, timing, test-count ]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v6

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "BW_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Release key restored."
          else
            echo "No KEYSTORE_BASE64 secret: the APK is signed with a debug key (a release tag's build is refused)."
          fi

      # v1.9 A8 (R16): an APK that does not install over the last release makes the user uninstall
      # the app, which deletes the artworks. checkReleaseGuards (app/build.gradle.kts) refuses the
      # build of a release tag without the release keystore, or with a versionCode (the run number)
      # not above the last release's: the run number of the last vX.Y.Z release tag's build. A push to
      # main or a pull request is not guarded (the lead, at A8's merge), so its build stays green.
      - name: Find the last release's versionCode
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          last_tag=$(gh release list --exclude-drafts --limit 100 --json tagName --jq '.[].tagName' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -vxF "$GITHUB_REF_NAME" | sort -V | tail -n 1 || true)
          if [ -z "$last_tag" ]; then
            echo "No earlier release."
            exit 0
          fi
          code=$(gh run list --workflow android.yml --branch "$last_tag" --event push --status success --limit 1 \
            --json number --jq '.[0].number // empty')
          if [ -z "$code" ]; then
            echo "::error::No successful build of $last_tag found, so its versionCode is unknown."
            exit 1
          fi
          echo "BW_LAST_VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "The last release, $last_tag, has versionCode $code; this build has ${{ github.run_number }}."

      - name: Build release APK
        env:
          BW_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BW_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          BW_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          BW_VERSION_CODE: ${{ github.run_number }}
          BW_VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          BW_RELEASE_GUARD: ${{ github.ref_type == 'tag' }}
        run: ./gradlew --no-daemon assembleRelease

      # v1.9 A8: R8's mapping.txt turns a release crash report's stack back into names.
      - uses: actions/upload-artifact@v7
        with:
          name: mapping-${{ github.run_number }}
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/Brushwork-${GITHUB_REF_NAME//\//-}.apk"
          ls -la dist

      - uses: actions/upload-artifact@v7
        with:
          name: Brushwork-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.apk
          generate_release_notes: true
